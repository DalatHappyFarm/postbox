packages:
  - packages/*
allowBuilds:
  esbuild: true
  workerd: true
# Supply chain: a new release waits 7 days before it can be installed, a package that loses its trusted publishing
# cannot slip in as an update, and transitive dependencies come only from the registry.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
# Old releases from before npm provenance, pulled in by dev tooling (React Native types, @types/node); newer ones are signed.
trustPolicyExclude:
  - semver@6.3.1
  - ua-parser-js@0.7.41
  - undici-types@6.21.0
blockExoticSubdeps: true
